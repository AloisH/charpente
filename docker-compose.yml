# The real deployment stack. Images are pulled by tag from GHCR;
# deployment is `docker compose pull && docker compose up -d` (just deploy).
# Secrets come from .env next to this file — never commit it.
name: charpente

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-charpente}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    image: ghcr.io/${GHCR_OWNER:?}/charpente-app:${APP_TAG:-latest}
    environment:
      APP_ENV: prod
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-charpente}
      SESSION_KEY: ${SESSION_KEY:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  site:
    image: ghcr.io/${GHCR_OWNER:?}/charpente-site:${SITE_TAG:-latest}
    environment:
      NUXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?}
      NUXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?}
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - site
    restart: unless-stopped

  # Self-hosted S3 storage. Uncomment to run RustFS on the same host and set
  # S3_ENDPOINT=http://rustfs:9000 — or point S3_* at any external S3
  # (Scaleway, R2, Backblaze, AWS) and leave this off.
  # rustfs:
  #   image: rustfs/rustfs:latest
  #   environment:
  #     RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  #     RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?}
  #   volumes:
  #     - rustfsdata:/data
  #   restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # rustfsdata:
