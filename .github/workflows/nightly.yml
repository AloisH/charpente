name: Nightly

# Slow, high-signal gates that never block a PR.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Macros compile from the committed .sqlx cache; #[sqlx::test] uses
      # DATABASE_URL at runtime and applies migrations itself.
      DATABASE_URL: postgres://charpente:charpente@localhost:5432/charpente
      SQLX_OFFLINE: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: charpente
          POSTGRES_PASSWORD: charpente
          POSTGRES_DB: charpente
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charpente"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # --all-features enables embed-spa: RustEmbed needs the folder to exist.
      - run: mkdir -p apps/app/dist
      - run: cargo mutants --workspace --timeout 120 -- --all-features
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 14

  schemathesis:
    runs-on: ubuntu-latest
    env:
      # Compile offline; the API migrates its own DB at startup.
      DATABASE_URL: postgres://charpente:charpente@localhost:5432/charpente
      SQLX_OFFLINE: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: charpente
          POSTGRES_PASSWORD: charpente
          POSTGRES_DB: charpente
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charpente"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Start the API
        run: |
          cargo build -p api
          SESSION_KEY=$(openssl rand -base64 64 | tr -d '\n') \
          APP_ENV=dev S3_ENDPOINT=http://localhost:9000 S3_BUCKET=test \
          S3_ACCESS_KEY=test S3_SECRET_KEY=test \
          cargo run -p api & \
          timeout 60 sh -c 'until curl -sf http://localhost:8080/health/ready; do sleep 1; done'
      - name: Fuzz every endpoint from the spec
        run: |
          pipx install schemathesis
          schemathesis run openapi.json --url http://localhost:8080 --checks all || true

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Registry references must be lowercase; the repo owner may not be.
      - name: Resolve the image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charpente-app:latest" >> "$GITHUB_OUTPUT"
      # No release tag has been pushed until the first `v*` tag — skip cleanly
      # instead of failing on a nonexistent image.
      - name: Check the image exists
        id: exists
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ steps.image.outputs.ref }} is not published yet — skipping scan"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan the latest published image
        if: steps.exists.outputs.yes == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: "0"
