name: Release app

# Tag v1.2.3 → push ghcr.io/<owner>/charpente-app:{1.2.3, 1.2, latest}
# plus a GitHub Release with a conventional-commit changelog.
# CI stops at "image is in GHCR" — deployment is `just deploy` on the server.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MINOR=${VERSION%.*}
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          echo "tags=ghcr.io/$OWNER/charpente-app:$VERSION,ghcr.io/$OWNER/charpente-app:$MINOR,ghcr.io/$OWNER/charpente-app:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
