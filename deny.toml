# cargo-deny — licenses, advisories, duplicate/banned deps (nightly CI)
[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "warn"
ignore = [
  # utoipa-axum → paste: upstream archived, no fix exists. Re-check whenever
  # utoipa-axum releases (they'll have to move off it eventually).
  "RUSTSEC-2024-0436",
  # rustls-webpki 0.101 via the aws-sdk v1 legacy rustls 0.21 chain — the SDK
  # pins it, `cargo update` can't move it. 0098/0099 need CA misissuance to
  # exploit; 0104 is a CRL-parsing panic and we never parse CRLs. Drop all
  # three when the AWS SDK defaults to the hyper1/rustls 0.23 client.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
]

[licenses]
allow = [
  "0BSD",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
