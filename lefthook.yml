pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,vue,js,mjs,json,css}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,vue,js,mjs}"
      run: pnpm exec oxlint {staged_files}
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    # Millisecond tripwires for the generated-artifact drift CI fails on
    # (stale .sqlx cache, openapi.json/client drift) — see the script header.
    drift-guard:
      glob: "*.{rs,sql}"
      run: sh scripts/pre-commit-drift-guard.sh
    gitleaks:
      run: sh -c 'command -v gitleaks >/dev/null && gitleaks protect --staged --no-banner || true'

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
