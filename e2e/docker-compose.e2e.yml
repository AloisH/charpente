# Stack for the e2e job: the production app image (built with
# CARGO_FEATURES=embed-spa,test-endpoints) against real Postgres + RustFS.
name: charpente-e2e

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: charpente
      POSTGRES_PASSWORD: charpente
      POSTGRES_DB: charpente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charpente"]
      interval: 2s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set e2e http://rustfs:9000 rustfsadmin rustfsadmin &&
      mc mb --ignore-existing e2e/charpente &&
      printf '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader></CORSRule></CORSConfiguration>' > /tmp/cors.xml &&
      mc cors set e2e/charpente /tmp/cors.xml
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Web UI + REST API, host-reachable so tests can read delivered mail.
      - "8125:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    image: charpente-app:e2e
    ports:
      - "8180:8080"
    environment:
      APP_ENV: prod
      DATABASE_URL: postgres://charpente:charpente@db:5432/charpente
      SESSION_KEY: 5uYAqQnrJyE31/Wg0GXrjq3S9THd2YuvRlXcxOXPX/Uc0uOEmM3a5uAqto9G6cE0X2Ie5PRIsMPSoPzvXMcyGA==
      # The API talks to rustfs over the compose network; the e2e browser
      # reaches it from the host via the port mapping (non-dev ports, so
      # the e2e stack can run beside `just infra`).
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_BUCKET: charpente
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: e2e-admin-password
      SMTP_URL: smtp://mailpit:1025
      # Emailed links must point at the app as the browser reaches it.
      MAIL_BASE_URL: http://localhost:8180
    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
